<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de cliente</title>

    <style type="text/css"> 
  
        label { 
          font-size: 18px; 
        } 
        form {
            width: 500px;
            border: 1px solid black; 
        }
        input { 
          margin: 7px; 
          padding: 2px 
        } 
        .form-label{
            margin-bottom:0!important;
            }     
        .txt {
            display: inline-block;
              width: 80%;
              outline: none;
            margin:0;
        }
    </style>
</head>

<body>
    <center><img src="HelpDeskGirl.png" alt="Nuestra imagen corporativa" style="width:200px;height:150px;"></center>
    <center>
        <h1>Sistema de Mesa de Ayuda</h1>
        <h2>Registro</h2>
    </center>
    
    <center>
    <form class="form" id="formRegistro" style="background-color:#d8f7cf" width="100px" border="1">
        <br>
        <table>
            <tr style="height:10px;">
                <td>
                    <label for="cliForm" class="form-label">
                        Nombre
                    </label>
                </td>                           
            </tr>
            <tr style="height:10px;">    
                <td>
                    <input class="txt" name="nombre" type="text" placeholder="Nombre">
                    <br>
                </td>
            </tr>

            <tr><td>&nbsp;</td></tr>

            <tr style="height:10px;">
                <td>
                    <label for="passForm" class="form-label">
                        Correo Electrónico
                    </label>
                </td>               
            </tr>
            <tr>    
                <td>
                    <input class="txt" name="contacto" type="email" placeholder="Correo Electrónico">
                    <br>
                </td>
            </tr>

            <tr><td>&nbsp;</td></tr>

            <tr style="height:10px;">
                <td>
                    <label for="passForm" class="form-label">
                        Contraseña
                    </label>
                </td>               
            </tr>
            <tr>    
                <td>
                    <input class="txt" name="password" type="password" placeholder="Contraseña" >
                    <br>
                </td>
            </tr>

            <tr><td>&nbsp;</td></tr>

            <tr style="height:10px;">
                <td>
                    <label for="passForm" class="form-label">
                       Confirmar Contraseña
                    </label>
                </td>               
            </tr>
            <tr>    
                <td>
                    <input class="txt" name="ConfirmarPassword" type="password" placeholder="Confirmar Contraseña" >
                    <br>
                </td>
            </tr>

            <tr>
                <td>
                    <span id="errorPassword" style="color:red;"></span>
                </td>
            </tr>

            <tr>
                <td>
                    <br>
                    <input name="termscondition" type="checkbox" > Acepto los términos y condiciones del ingreso al sistema (S.E.u.O)</p>
                    </br>
                </td>
            </tr>
            <tr>
                <td>
                    <span id="resultado2"></span>
                </td>
            </tr>

        </table>

        <button type="submit" id="btnregistrar">
            Registrarse
        </button>

        <p>
            <a href="loginClient.html">
                Volver al inicio de sesíon
            </a>
        </p>
    </form>
    </center>

    <script src="registroCliente.js" type="module"></script>
    
</body>
</html>S
